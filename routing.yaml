# routing.yaml — черновик конфига автораспределения тем портала ТП
#
# Источники:
#   - таблица навыков (снимок 2026-08-12)
#   - query 24 Data Explorer (portal usernames + загрузка)
#   - categories.json / tags.json портала
#
# ПРОВЕРИТЬ РУКАМИ:
#   1. Цифры в skills — переносил из Google Sheets, пустые колонки могли
#      сместить значения на соседа.
#   2. auto: у Кильпио поставил false (3 темы против 10-115 у остальных —
#      похоже, вне ротации). Поправьте, если нет.
#   3. Теги в domains — вписал существующие на портале, список не полный.

thresholds:
  primary: 3      # оценка 3 — основной пул
  reserve: 2      # оценка 2 — только если ни одной тройки в сети
  min_domain_score: 4   # слабее (одно слово в тексте) — считаем «не уверен» → по загрузке/ИИ
  # 0, 1 и пусто — по этому домену не назначаем никогда.
  # пусто (null) != 0: null означает «не заполнял», при апдейте матрицы
  # человек может оказаться компетентным — не хороним.

presence:
  online_within_minutes: 45    # last_seen_at не старше → считаем «в сети»
  working_hours: "07:30-20:00" # ГЛОБАЛЬНОЕ окно бота = объединение всех смен (Кузнецов с 7:30,
                               # Кильпио до 20:00). Вне него бот вообще не работает. Персональные
                               # смены — в engineers.<u>.hours, они и режут кандидатов внутри окна.
  tz: Europe/Moscow
  # last_seen_at не знает про отпуска. Пока: ручной флаг away в engineers.
  # Дальше можно цеплять календарь отпусков, если он есть в машиночитаемом виде.

load:
  # НЕ raw active assignments: там кладбище (у BrainRoot 115 живых назначений).
  # Считаем темы с постами за окно — реальная текущая нагрузка.
  metric: assigned_topics_with_activity
  window_days: 7

# Фолбэк: никого подходящего в сети → дежурный (duty) в режиме assign,
# в suggest — скрытое сообщение «нужен ручной разбор».
# Группу support НЕ использовать: в ней ~70 человек включая ботов — уведомит всех.
duty: null   # portal username дежурного; менять при передаче дежурства

bot:
  mode: assign               # off | suggest (скрытые сообщения) | assign (боевой). Перебивается env BOT_MODE.
  brain: ai                  # ai — ИИ-оператор решает в рамках гейтов | rules — только ключевики
  feed_query: 53             # autoassign_feed — неразобранные темы (public + ЛС группы support)
  presence_query: 54         # autoassign_presence — присутствие + загрузка за окно
  explorer_group: support    # запросы 53/54 расшарены на эту группу → гоняем через
                             # /g/<group>/reports/<id>/run; боту НЕ нужен admin, хватает
                             # членства в группе (support_bot в support). null → admin-эндпоинт.
  feed_days: 4
  min_topic_age_minutes: 15  # молодые темы не трогаем — шанс взять руками
  max_consecutive_per_user: 2  # не назначать 3+ темы подряд одному; 3-ю перекинуть на др.
                               # кандидата. Стрик считается по последним назначениям (state).
  enforce_working_hours: true
  explain_assign: true       # в режиме assign дублировать причину скрытым сообщением
  state_file: data/state.json   # рантайм-состояние (в Docker — на volume ./data)
  # ИИ-мозг: OpenAI-совместимый endpoint, настройки в env (см. .env.example):
  # AI_API_KEY, AI_MODEL (реком. gpt-5.6-sol), AI_BASE_URL, опц. AI_TEMPERATURE/AI_REASONING_EFFORT.
  # Нет ключа / ошибка / ответ не прошёл гейты → автоматический откат на правила.
  spam:
    enabled: true
    min_score: 4          # порог detectSpam; консервативно, чтобы не флажить живых клиентов
    # Спам НИКОГДА не удаляем и не закрываем сами. Только помечаем на ручную проверку:
    #   1) скрытое сообщение в теме «подозрение на спам» (видят модераторы),
    #   2) строка в review_log,
    #   3) если задан review_topic_id — дубль списком в служебную тему (удобно глазами).
    review_log: data/spam-review.jsonl
    review_topic_id: 41381 # тема «🤖 Спам на проверку», категория «Для сотрудников» (staff-only)

gates:
  # Жёсткие гейты: не входишь — не назначаем, даже если больше некому.
  # Английские темы идут ТОЛЬКО этим троим (строка «Англоязычные письма»).
  # Елена и Кильпио при этом в общей ротации не участвуют (auto: false) —
  # им достаются только англоязычные.
  english:
    engineers: [Bringer, JackDallas, Alexander_Kuznetsov]

# hours: персональная смена по МСК; вне неё инженеру темы не назначаются даже если он онлайн.
# null → без ограничения (по глобальному окну presence.working_hours).
# away: true — временно/отпуск, правится тут (нужен редеплой).
# САМО-ПАУЗА без редеплоя: инженер включает «Не беспокоить» (Do Not Disturb) в меню
#   профиля (луна) — на 30мин/1ч/2ч/до завтра/свой срок. Пока DND активен, бот его
#   пропускает; сам снимется по таймеру или вручную. Флаг paused приходит из query 54
#   (EXISTS активного do_not_disturb_timings). Группу autoassign-paused больше не используем.
engineers:
  Bringer:              {name: Елена Савченко,      tg: "@Dominatorrrrr",       auto: false, away: false, hours: "10:00-19:00"}  # только EN
  BrainRoot:            {name: Андрей Радионов,     tg: "@brainroot",           auto: true,  away: false, hours: "10:00-19:00"}
  Aleksandr_Khlebnikov: {name: Александр Хлебников, tg: "@MicroVolk",           auto: true,  away: false, hours: "08:00-17:00"}
  DmitryKur:            {name: Дмитрий Курятников,  tg: "@dmitykur",            auto: true,  away: false, hours: "08:00-17:00"}
  JackDallas:           {name: Александр Кильпио,   tg: "@jackdallas",          auto: false, away: false, hours: "11:00-20:00"}  # только EN
  Alexey_Zhabrovets:    {name: Алексей Жабровец,    tg: "@alexey_zhabrovets",   auto: true,  away: false, hours: "08:00-16:00"}
  Alexander_Kuznetsov:  {name: Александр Кузнецов,  tg: "@wonder_over_yonder",  auto: true,  away: false, hours: "07:30-16:00"}  # EN + общая
  Understarfall:        {name: Сергей Шишенко,      tg: "@understarfall",       auto: true,  away: false, hours: null}          # ЧАСЫ НЕ ЗАДАНЫ — уточнить у Сергея
  enginPetr:            {name: Пётр Скорик,         tg: "@enginPetr",           auto: true,  away: false, hours: "09:00-18:00"}

