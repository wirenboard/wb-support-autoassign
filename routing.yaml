# Как тема попадает в домен. Порядок сигналов:
#   1. теги (если уже стоят), 2. категория, 3. ключевые слова в заголовке+первом посте,
#   4. ничего не сработало → ИИ-классификатор, 5. и он не уверен → дежурный.
domains:
  modbus:
    categories: [wb-modbus-peripherals]        # id 10, Периферийные устройства
    tags: [modbus, wb-mqtt-serial, mr, mdm3, wb-led, wb-msw]
    # kw матчатся от границы слова с открытым хвостом: 'wb-m' покрывает всю линейку wb-mr/mdm/msw/mge/mai
    keywords: [modbus, регистр, rs-485, rs485, crc, "не отвечает", опрос, wb-mqtt-serial, шаблон, msw, wb-msw, wb-m, wb-led, mai6, частотн]
  mqtt:
    tags: [mqtt]
    keywords: [mosquitto, брокер, топик]
  wb-rules:
    tags: [wb-rules]
    keywords: [defineRule, правило, скрипт, виртуальное устройство]
  linux:
    categories: [wiren-board]                  # id 17, Контроллеры — дефолт домена
    keywords: [ssh, консоль, apt, обновлен, testing, корнев, места нет, перезагружается]
  backup:
    # 'резервн' — стем, ловит «резервную/резервная/резервное копирование»
    keywords: [бэкап, резервн, backup, wb-backup, снапшот, восстановлен, "образ системы"]
  network:
    keywords: [wi-fi, wifi, сеть, ip, eth, networkmanager, network-manager, vpn, интернет, не пингуется]
  zigbee:
    tags: [zigbee, zigbee2mqtt]
    keywords: [zigbee]
  zwave:
    tags: [z-wave]
    keywords: [z-wave, zwave, z-way]
  knx:
    tags: [knx]
    keywords: [knx, knxd]
  dali:
    keywords: [dali]
  snmp:
    keywords: [snmp]
  bacnet:
    keywords: [bacnet]
  spodes:
    keywords: [сподэс, длмс, dlms, счётчик электроэнергии меркурий]
  home-assistant:
    tags: [home-assistant]
    keywords: [home assistant, homeassistant, hacs]
  node-red:
    tags: [node-red]
    keywords: [node-red, nodered]
  grafana:
    tags: [grafana]
    keywords: [grafana, дашборд]
  zabbix:
    tags: [zabbix]
    keywords: [zabbix]
  alisa:
    keywords: [алис, яндекс]   # 'алис' — стем, ловит «Алисой/Алисе»
  codesys-iec:
    keywords: [codesys, кодесис, мэк 61131, fbd, ladder]
  electrical:
    # «автомат» голым словом нельзя — ловит «автоматизацию»
    keywords: [монтаж, подключить питание, блок питания, узо, дифавтомат, автоматический выключатель, заземление]
  wb6-legacy:
    tags: [wb5, wb6]
    keywords: [wb5, wb6, wiren board 5, wiren board 6]
  wb-modems:
    keywords: [модем, sim, симк, sms, 4g, lte, gsm, мобильн, wbc-4g, wbc-3g]
  wbio:
    keywords: [wbio, модуль расширения]
  internal-modules:
    keywords: [wbe2, внутренний модуль, hdmi]
  cloud:
    keywords: [облак, wirenboard.cloud, cloud, телеметрия]
  map:
    tags: [map]
    keywords: [map12, map6, map3, счётчик электроэнергии, трансформатор тока]
  mwac:
    keywords: [mwac, протечк, счётчик воды, нептун]
  hw-selection:
    categories: [right-hardware]               # id 28, Подбор оборудования
    tags: [подбор]
    keywords: [подбор, подобрать, подберите, посоветуйте, какой контроллер выбрать]
  heating:
    keywords: [отоплени, теплый пол, тёплый пол, котёл, котел, термостат, терморегулятор]
  batteries:
    keywords: [батарейк, суперкап, ибп, wb-ups]
